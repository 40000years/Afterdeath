# Allies: the caster, their tamed animals, and members of their main-scoreboard team.
pvp: true
max-active-effects: 128
max-targets-per-effect: 32
meteor:
  ignite-terrain: true
  # Explosions damage entities but never remove terrain blocks.
  damage: 90.0
damage:
  sonic-boom: 75.0
  blaze-barrage: 25.0
  guardian-tidal-burst: 45.0
  poison-impact: 20.0
  lightning: 60.0
  lightning-secondary: 30.0
  frost-shatter: 35.0
  earth-wall-rupture: 25.0
  dragon-per-second: 30.0
  wither-skull: 40.0
  shulker-impact: 20.0
  shulker-singularity-burst: 120.0
  void-collapse: 45.0
  shadow-step-rupture: 25.0
  soul-nova: 35.0
  shroud-ambush: 50.0
  natures-bloom-thorns: 20.0
# Automatic extra stage from the same cast, with no additional mana or cooldown.
# Existing customized base damage settings are preserved when upgrading.
follow-up:
  damage:
    lightning_strike: 18.0
    frost_nova: 25.0
    shadow_step: 20.0
    natures_bloom: 15.0
    earth_wall: 25.0
    dragons_breath: 30.0
    void_pull: 20.0
    sonic_boom: 25.0
    blaze_barrage: 20.0
    wither_ray: 15.0
    shulker_levitation: 20.0
    meteor_strike: 15.0
    iron_armor: 25.0
    vex_legion: 25.0
    guardian_beam: 20.0
# Bundled pack is automatically offered one tick after joining.
resource-pack:
  enabled: true
  # Optional external direct URL. Empty = serve the embedded ZIP automatically.
  url: ''
  # Empty = embedded ZIP's SHA-1. Set this for a modified externally hosted pack.
  sha1: ''
  required: false
  host:
    enabled: true
    bind: '0.0.0.0'
    # Players must be able to access this TCP port (allocate it on hosting panels).
    port: 8187
    # Empty = hostname the player joined. Set explicitly for proxies/SRV records.
    public-host: ''
    # Optional HTTP(S) reverse-proxy base URL. The pack path is appended.
    public-url: ''
  geyser:
    # Copies Advance Magic's own files during onLoad, before Geyser starts.
    auto-install: true

compatibility:
  # false: player roots use Slowness V; mobs retain the full root.
  # true: also force player positions/velocity; test with your anticheat first.
  hard-player-roots: false
  # Server-sent, capped knockback/pull. Set false for strict servers (damage is unchanged).
  player-spell-velocity: true
  max-player-horizontal-velocity: 1.1
  max-player-vertical-velocity: 0.9
