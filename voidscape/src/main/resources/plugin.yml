name: Voidscape
version: '3.0.0'
main: com.example.voidscape.VoidscapePlugin
api-version: '26.2'
description: Advance Magic Expansion - Crying obsidian portal, 3 sanctums and trial vaults.
softdepend: [floodgate]
commands:
  voidscape:
    aliases: [void]
    description: Explore Voidscape and claim dungeon relics
    usage: /void help
permissions:
  voidscape.enter:
    default: true
  voidscape.admin:
    default: op
