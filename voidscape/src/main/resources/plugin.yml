name: Voidscape
version: '2.0.0'
main: com.example.voidscape.VoidscapePlugin
api-version: '26.2'
description: Rare floating mansion dungeons, alien guardians and endgame relics.
softdepend: [floodgate]
commands:
  voidscape:
    aliases: [void]
    description: Explore Voidscape and claim dungeon relics
    usage: /void help
permissions:
  voidscape.enter:
    default: true
  voidscape.admin:
    default: op
