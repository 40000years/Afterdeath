# ===============================================
# Voidscape Lite Configuration
# ปรับแต่งค่าระบบมิติ The Void, การเพิ่มประสิทธิภาพ, และมอนสเตอร์ยักษ์
# ===============================================

dimension:
  # ชื่อโลกมิติ The Void
  world-name: "the_void"
  # ความสูงของเกาะลอยฟ้าเริ่มต้น
  island-base-y: 64
  # ปิดดาเมจจากการตก (Fall Damage) ใน The Void 100%
  disable-fall-damage: true
  # พิกัดเกิดบนแท่นบูชา Zenith Altar ที่ปลอดภัย
  spawn-x: 0.5
  spawn-y: 141.0
  spawn-z: 14.5

performance:
  # ปิดฝน/พายุใน The Void ถาวร (แก้ปัญหา Client Lag 100% จากการเรนเดอร์เม็ดฝนในความว่างเปล่า)
  disable-storm: true
  # เปิดเอฟเฟกต์หมอก Darkness (บรรยากาศมืดสลัว มองเห็นรอบตัวได้พรางๆ พอมองเห็นทางได้)
  enable-darkness: true
  # เปิดเอฟเฟกต์ตัดระยะสายตา Blindness (ค่าเริ่มต้น false เพื่อไม่ให้จอดำมืดสนิทจนมองไม่เห็นอะไรเลย)
  enable-blindness: false

portal:
  # ความลึกของ Bedrock ที่เริ่มทำงาน (Y <= ค่านี้)
  bedrock-trigger-y: -59
  # เวลายืนบน Bedrock เพื่อเปิดประตูมิติ (วินาที)
  stand-duration-seconds: 3
  # วาร์ปทันทีเมื่อตกทะลุใต้ Bedrock (Overworld void)
  void-fall-teleport: true

infusion:
  # ระยะเวลาระหว่างการลดเลือดสูงสุด (Max Health) ใน Void (วินาที)
  interval-seconds: 60
  # เลือดที่หักในแต่ละรอบ (2.0 = 1 หัวใจ)
  reduction-amount: 2.0
  # เลือดขั้นต่ำที่ไม่ลดต่อ (4.0 = 2 หัวใจ)
  min-health: 4.0

spawning:
  # รอบการตรวจจับและเสกมอนสเตอร์ (วินาที)
  interval-seconds: 3
  # โอกาสเกิดมอนสเตอร์ในแต่ละรอบ (0.0 ถึง 1.0)
  chance: 0.80
  # จำนวนมอนสเตอร์ Void สูงสุดรอบตัวผู้เล่น 1 คน (ในระยะ 45 บล็อก)
  max-mobs-per-player: 8
  # จำนวนมอนสเตอร์ที่เสกพร้อมกันใน 1 ครั้ง (1 ถึง 3 ตัว)
  spawn-batch-size: 2

  # 1. พญาเงาเวหาทมิฬ (Giant Phantom - Void Leviathan)
  giant-phantom:
    enabled: true
    weight: 50
    # ขนาดโมเดลปีกตามเอนจินของ Minecraft Phantom (ค่าปกติ 0, ค่า 6 = ตัวมหึมา)
    size: 6
    # อัตราส่วนขยายขนาด Entity Scale (2.2 เท่า)
    scale: 2.2
    # หลอดเลือด HP (ปกติ 20 -> 20 เท่า = 400 HP / 200 หัวใจ)
    health: 400.0
    # พลังโจมตี
    attack-damage: 14.0

  # 2. ภูตทมิฬกลืนวิญญาณ (Giant Vex - Abyssal Shade)
  giant-vex:
    enabled: true
    weight: 50
    # อัตราส่วนขยายขนาด Entity Scale (2.8 เท่า = ปีศาจบินตัวใหญ่ยักษ์)
    scale: 2.8
    # หลอดเลือด HP (ปกติ 14 -> 20 เท่า = 280 HP / 140 หัวใจ)
    health: 280.0
    # พลังโจมตี
    attack-damage: 12.0

  # 3. เงาแห่งความมืด (Shadow Stalker - Wither Skeleton)
  shadow-stalker:
    enabled: true
    weight: 25
    scale: 1.5
    health: 200.0
    attack-damage: 14.0

rewards:
  # โอกาสดรอป Voidic Crystal จากมอนสเตอร์เงา (0.0 ถึง 1.0)
  stalker-crystal-chance: 0.75
  # โอกาสดรอป Null Fruit จากมอนสเตอร์เงา (0.0 ถึง 1.0)
  null-fruit-chance: 0.35
  # คูลดาวน์ของสกิล Shadow Dash บนดาบ (วินาที)
  shadow-dash-cooldown: 6

chests:
  # โอกาสเกิดหีบสมบัติบนยอดเสาศิลา Spire (0.0 ถึง 1.0, 0.10 = 10%)
  spawn-chance: 0.10
  # จำนวนกองไอเทมต่อหีบ (สุ่มระหว่าง min ถึง max)
  min-items: 2
  max-items: 4

boss:
  # เปิดใช้งานระบบบอสราชันย์ก้นบึ้ง (Abyssal Warden Boss)
  enabled: true
  name: "💀 ราชันย์ก้นบึ้งทมิฬ (The Abyssal Warden)"
  # หลอดเลือด HP (ค่าปกติ 5000.0 = 2500 หัวใจ)
  health: 5000.0
  # ขยายขนาดตัวโมเดล Entity Scale (ขยายเพิ่มอีก 5 เท่าจาก 4.5x = 22.5 เท่า สูงกว่า 65 บล็อก!)
  scale: 22.5
  # การันตี 1-Hit Kill (ดาเมจสูงลิ่ว 2000+)
  one-hit-kill: true
  attack-damage: 2000.0
  # เกิดอัตโนมัติประจำชั้นล่างสุดทันที (ไม่ต้องพิมพ์คำสั่ง)
  auto-spawn-on-start: true
  # เกิดใหม่อัตโนมัติเมื่อตาย (หน่วย: นาที, 0 = ไม่เกิดอัตโนมัติ)
  respawn-interval-minutes: 60
  # พิกัดกึ่งกลางลานประลอง Layer 3 (จุดเกิดและจุดดึงกลับเมื่อใกล้ตก Void)
  arena-center-x: 8000.5
  arena-center-y: -51.0
  arena-center-z: 0.5
  # รัศมีลานประลองที่ปลอดภัย (หากบอสออกนอกรัศมีนี้จะถูก Recall วาร์ปกลับ)
  arena-radius: 135.0
  # ดึงผู้เล่นที่อยู่ห่างเกินไปเข้ามาในสนาม (Abyssal Gravity Pull)
  enable-gravity-pull: true
