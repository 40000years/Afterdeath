# ========================================================
# AntiFreecam Configuration (Anti-Xray / Container Masking)
# ========================================================

masking:
  # เปิดใช้งานระบบพรางหีบ/สิ่งมีค่าใต้ดิน (แบบ Anti-Xray)
  enabled: true

  # รัศมีตรวจจับบล็อกรอบตัวผู้เล่น (บล็อก)
  scan-radius: 20

  # ระยะทางที่ตัวจริงของผู้เล่นต้องเข้าใกล้เพื่อเปิดเผยบล็อกจริง (บล็อก)
  # เมื่อผู้เล่นถอดกล้อง Freecam บินห่างเกินระยะนี้ หีบจะถูกพรางเป็นหินทันที
  reveal-distance: 6.5

  # ต้องมีเส้นสายตาตรง (Line of Sight) จากดวงตาจริงของผู้เล่นหรือไม่
  # หากอยู่หลังกำแพงทึบ จะยังคงเห็นเป็นหินจนกว่าจะเดินพ้นมุมกำแพง
  require-line-of-sight: true

  # ระดับ Y สำหรับเลือกบล็อกพราง (ต่ำกว่า Y นี้จะพรางเป็น Deepslate, สูงกว่าจะพรางเป็น Stone)
  deepslate-threshold-y: 0

  # ความถี่ในการสแกนและอัปเดตมุมมอง (ticks) (20 ticks = 1 วินาที)
  update-interval-ticks: 12

# ระบบป้องกันการคลิก/เปิดหีบทะลุกำแพงแบบเงียบๆ (Silent Occlusion Protection)
interaction-protection:
  # ยกเลิกการคลิกเปิดหีบ/บล็อกผ่านสิ่งกีดขวางแบบเงียบๆ
  cancel-occluded-interact: true
  # ยกเลิกการทุบบล็อกผ่านกำแพงทึบแบบเงียบๆ
  cancel-occluded-break: true
